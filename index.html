
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>SirTrosOS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        #webview {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }
    </style>
</head>

<body>

    <iframe
        id="webview"
        src="https://sirtros.github.io/Mobile/startup"
        title="SirTrosOS"
        sandbox="allow-scripts allow-forms allow-same-origin">
    </iframe>

</body>
</html>
