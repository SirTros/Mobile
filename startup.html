
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SirTrosOS</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: 'Nunito', sans-serif;
    touch-action: none;
}

#startScreen {
    position: fixed;
    inset: 0;
    background: #05070c;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.start-content {
    text-align: center;
    transform: translateY(-60px);
}

.start-logo {
    font-size: clamp(48px, 10vw, 78px);
    font-weight: 900;
    letter-spacing: -4px;
    margin-bottom: 35px;
}

.blue {
    color: #258cff;
}

button {
    border: none;
    outline: none;
    font-family: inherit;
    cursor: pointer;
}

.start-button {
    background: #258cff;
    color: white;
    padding: 15px 65px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 900;
}

.start-button:active {
    transform: scale(.95);
}

#blackScreen {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 20;
    display: none;
    touch-action: none;
}

#bootScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 30;
}

.center-content {
    position: absolute;
    top: 33%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.boot-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
    font-size: clamp(42px, 9vw, 82px);
    font-weight: 900;
    letter-spacing: -4px;
}

.boot-logo span {
    opacity: 0;
    transform: translateY(15px);
    animation: letterIn .55s ease forwards;
}

.boot-logo span:nth-child(1) { animation-delay: .1s; }
.boot-logo span:nth-child(2) { animation-delay: .2s; }
.boot-logo span:nth-child(3) { animation-delay: .3s; }
.boot-logo span:nth-child(4) { animation-delay: .4s; }
.boot-logo span:nth-child(5) { animation-delay: .5s; }
.boot-logo span:nth-child(6) { animation-delay: .6s; }
.boot-logo span:nth-child(7) { animation-delay: .7s; }
.boot-logo span:nth-child(8) { animation-delay: .8s; }
.boot-logo span:nth-child(9) { animation-delay: .9s; }

@keyframes letterIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.loading-track {
    width: 85%;
    height: 5px;
    background: #292929;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 22px;
}

.loading-bar {
    width: 0%;
    height: 100%;
    background: white;
    border-radius: 20px;
}

.bottom-powered {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    white-space: nowrap;
}

.powered-text {
    color: #258cff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
}

.html-logo {
    width: 32px;
    height: 36px;
    object-fit: contain;
}

@media(max-width: 500px) {
    .boot-logo {
        font-size: clamp(36px, 10vw, 55px);
        letter-spacing: -2px;
    }

    .loading-track {
        width: 90%;
    }

    .html-logo {
        width: 28px;
        height: 32px;
    }
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen">
    <div class="start-content">
        <div class="start-logo">
            <span class="blue">S</span>ir<span class="blue">T</span>ros<span class="blue">OS</span>
        </div>

        <button class="start-button" id="startButton">
            START
        </button>
    </div>
</div>

<!-- ČERNÁ OBRAZOVKA -->
<div id="blackScreen"></div>

<!-- STARTUP -->
<div id="bootScreen">

    <div class="center-content">
        <div class="boot-logo">
            <span class="blue">S</span>
            <span>i</span>
            <span>r</span>
            <span class="blue">T</span>
            <span>r</span>
            <span>o</span>
            <span>s</span>
            <span class="blue">O</span>
            <span class="blue">S</span>
        </div>

        <div class="loading-track">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
    </div>

    <div class="bottom-powered">
        <span class="powered-text">POWERED BY</span>
        <img class="html-logo" src="assets/html.png" alt="HTML">
    </div>

</div>

<script>
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const blackScreen = document.getElementById("blackScreen");
const bootScreen = document.getElementById("bootScreen");
const loadingBar = document.getElementById("loadingBar");

let stage = 0;
let holdTimer = null;
let holding = false;
let completed = false;
let wakeLock = null;

/* ZABRÁNĚNÍ USÍNÁNÍ DISPLEJE */
async function keepScreenAwake() {
    if (!("wakeLock" in navigator)) return;

    try {
        if (wakeLock && !wakeLock.released) return;

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
            wakeLock = null;
        });
    } catch (error) {
        console.log("Wake Lock není dostupný:", error);
    }
}

/* OBNOVENÍ WAKE LOCKU */
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && stage >= 1) {
        keepScreenAwake();
    }
});

/* PRVNÍ KLIKNUTÍ – FULLSCREEN */
startButton.addEventListener("click", async () => {
    if (stage !== 0) return;

    stage = 1;

    // Aktivace ochrany displeje
    keepScreenAwake();

    // Fullscreen
    if (!document.fullscreenElement &&
        document.documentElement.requestFullscreen) {
        try {
            await document.documentElement.requestFullscreen();
        } catch (error) {
            console.log("Fullscreen není dostupný:", error);
        }
    }

    startScreen.style.display = "none";
    blackScreen.style.display = "block";
});

/* PODRŽENÍ KDEKOLIV NA ČERNÉ OBRAZOVCE */
function beginHold(event) {
    if (stage !== 1 || holding || completed) return;

    event.preventDefault();
    holding = true;

    holdTimer = setTimeout(() => {
        if (!holding || completed) return;

        completed = true;
        holding = false;

        // Vibrace
        if (navigator.vibrate) {
            navigator.vibrate([100, 70, 100]);
        }

        blackScreen.style.display = "none";
        bootScreen.style.display = "block";

        requestAnimationFrame(() => {
            bootScreen.style.opacity = "1";
        });

        startLoading();
    }, 3000);
}

function endHold() {
    if (!holding || completed) return;

    holding = false;
    clearTimeout(holdTimer);
}

blackScreen.addEventListener("pointerdown", beginHold);
document.addEventListener("pointerup", endHold);
document.addEventListener("pointercancel", endHold);

/* 30 SEKUND LOADINGU */
function startLoading() {
    const keyframes = [
        [0, 0],
        [2, 3],
        [4, 3],
        [6, 15],
        [8, 19],
        [10, 19],
        [12, 37],
        [14, 43],
        [16, 43],
        [18, 65],
        [20, 72],
        [22, 72],
        [24, 88],
        [26, 94],
        [28, 94],
        [30, 100]
    ];

    const startTime = performance.now();

    function update(now) {
        const elapsed = Math.min((now - startTime) / 1000, 30);
        let progress = 0;

        for (let i = 0; i < keyframes.length - 1; i++) {
            const current = keyframes[i];
            const next = keyframes[i + 1];

            if (elapsed >= current[0] && elapsed <= next[0]) {
                const part = (elapsed - current[0]) /
                    (next[0] - current[0]);

                const eased = part * part * (3 - 2 * part);

                progress = current[1] +
                    (next[1] - current[1]) * eased;

                break;
            }
        }

        if (elapsed >= 30) progress = 100;

        loadingBar.style.width = progress + "%";

        if (elapsed < 30) {
            requestAnimationFrame(update);
        } else {
            setTimeout(finishBoot, 500);
        }
    }

    requestAnimationFrame(update);
}

/* KONEC STARTUPU */
function finishBoot() {
    bootScreen.style.opacity = "0";

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
}
</script>

</body>
</html>
