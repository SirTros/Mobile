
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SirTrosOS – Start</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: 'Nunito', sans-serif;
}

/* START */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070c;
    transition: opacity .7s ease;
}

.start-content {
    text-align: center;
}

.start-logo {
    font-size: clamp(48px, 10vw, 78px);
    font-weight: 900;
    letter-spacing: -4px;
    margin-bottom: 35px;
}

.blue {
    color: #258cff;
}

.start-button {
    border: none;
    color: white;
    background: #258cff;
    border-radius: 16px;
    padding: 15px 65px;
    font-family: inherit;
    font-weight: 900;
    font-size: 17px;
    cursor: pointer;
    touch-action: none;
}

.start-button:active {
    transform: scale(.95);
}

/* ČERNÁ OBRAZOVKA */

#holdScreen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 8;
    display: none;
}

/* BOOT */

#bootScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
}

/* HLAVNÍ LOGO UPROSTŘED */

.center-content {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 650px);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.boot-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-size: clamp(45px, 9vw, 82px);
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 1.1;
}

.boot-logo span {
    display: inline-block;
    opacity: 0;
    transform: translateY(15px);
    animation: letterIn .55s ease forwards;
}

.boot-logo span:nth-child(1) { animation-delay: .1s; }
.boot-logo span:nth-child(2) { animation-delay: .2s; }
.boot-logo span:nth-child(3) { animation-delay: .3s; }
.boot-logo span:nth-child(4) { animation-delay: .4s; }
.boot-logo span:nth-child(5) { animation-delay: .5s; }
.boot-logo span:nth-child(6) { animation-delay: .6s; }
.boot-logo span:nth-child(7) { animation-delay: .7s; }
.boot-logo span:nth-child(8) { animation-delay: .8s; }
.boot-logo span:nth-child(9) { animation-delay: .9s; }

@keyframes letterIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* LOADING */

.loading-track {
    width: 85%;
    height: 5px;
    background: #292929;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 22px;
}

.loading-bar {
    width: 0%;
    height: 100%;
    background: white;
    border-radius: 20px;
}

/* POWERED BY ÚPLNĚ DOLE */

.bottom-powered {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    white-space: nowrap;
}

.powered-text {
    color: #258cff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
}

.html-logo {
    width: 32px;
    height: 36px;
    object-fit: contain;
}

/* MOBIL */

@media(max-width: 500px) {
    .boot-logo {
        font-size: clamp(36px, 10vw, 55px);
        letter-spacing: -2px;
    }

    .loading-track {
        width: 90%;
        height: 4px;
        margin-top: 18px;
    }

    .powered-text {
        font-size: 11px;
    }

    .html-logo {
        width: 28px;
        height: 32px;
    }
}

@media(max-width: 350px) {
    .boot-logo {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">
    <div class="start-content">
        <div class="start-logo">
            <span class="blue">S</span>ir<span class="blue">T</span>ros<span class="blue">OS</span>
        </div>

        <button class="start-button" id="startButton">
            START
        </button>
    </div>
</div>

<!-- ČERNÁ OBRAZOVKA -->

<div id="holdScreen"></div>

<!-- BOOT SCREEN -->

<div id="bootScreen">

    <!-- LOGO UPROSTŘED -->

    <div class="center-content">

        <div class="boot-logo">
            <span class="blue">S</span>
            <span>i</span>
            <span>r</span>
            <span class="blue">T</span>
            <span>r</span>
            <span>o</span>
            <span>s</span>
            <span class="blue">O</span>
            <span class="blue">S</span>
        </div>

        <div class="loading-track">
            <div class="loading-bar" id="loadingBar"></div>
        </div>

    </div>

    <!-- POWERED BY DOLE, V JEDNOM ŘÁDKU -->

    <div class="bottom-powered">
        <span class="powered-text">POWERED BY</span>
        <img
            class="html-logo"
            src="assets/html.png"
            alt="HTML"
        >
    </div>

</div>

<script>
const startScreen = document.getElementById("startScreen");
const holdScreen = document.getElementById("holdScreen");
const bootScreen = document.getElementById("bootScreen");
const startButton = document.getElementById("startButton");
const loadingBar = document.getElementById("loadingBar");

let holding = false;
let completed = false;
let holdTimer = null;

startButton.addEventListener("pointerdown", async () => {
    if (completed || holding) return;

    holding = true;

    try {
        if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        }
    } catch (e) {}

    startScreen.style.opacity = "0";

    setTimeout(() => {
        if (holding) {
            startScreen.style.display = "none";
            holdScreen.style.display = "block";
        }
    }, 700);

    holdTimer = setTimeout(() => {
        if (!holding) return;

        completed = true;
        holding = false;

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }

        holdScreen.style.display = "none";
        bootScreen.style.display = "block";

        requestAnimationFrame(() => {
            bootScreen.style.opacity = "1";
        });

        startLoading();
    }, 3000);
});

function cancelHold() {
    if (!holding || completed) return;

    holding = false;
    clearTimeout(holdTimer);

    startScreen.style.display = "flex";
    startScreen.style.opacity = "1";
    holdScreen.style.display = "none";
}

startButton.addEventListener("pointerup", cancelHold);
startButton.addEventListener("pointercancel", cancelHold);
startButton.addEventListener("lostpointercapture", cancelHold);

/* NEPRAVIDELNÉ NAČÍTÁNÍ – 30 SEKUND */

function startLoading() {
    const keyframes = [
        [0, 0],
        [2.5, 4],
        [4, 4],
        [6, 17],
        [7.5, 19],
        [9, 19],
        [12, 45],
        [14, 49],
        [15.5, 49],
        [19, 72],
        [21, 74],
        [23, 74],
        [26, 92],
        [28, 94],
        [30, 100]
    ];

    const startTime = performance.now();

    function update(now) {
        const elapsed = Math.min((now - startTime) / 1000, 30);
        let progress = 0;

        for (let i = 0; i < keyframes.length - 1; i++) {
            const current = keyframes[i];
            const next = keyframes[i + 1];

            if (elapsed >= current[0] && elapsed <= next[0]) {
                const part = (elapsed - current[0]) /
                    (next[0] - current[0]);

                const eased = part * part * (3 - 2 * part);

                progress = current[1] +
                    (next[1] - current[1]) * eased;

                break;
            }
        }

        if (elapsed >= 30) progress = 100;

        loadingBar.style.width = progress + "%";

        if (elapsed < 30) {
            requestAnimationFrame(update);
        } else {
            setTimeout(finishBoot, 500);
        }
    }

    requestAnimationFrame(update);
}

/* DOKONČENÍ STARTU */

function finishBoot() {
    bootScreen.style.opacity = "0";

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
}
</script>

</body>
</html>
